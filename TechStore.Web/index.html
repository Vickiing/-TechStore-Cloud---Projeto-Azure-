<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Produtos · TechStore</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <span class="eyebrow">TechStore</span>
        <h1>Produtos</h1>
        <p>Cadastre e organize os produtos da loja.</p>
      </div>
      <span class="count" id="product-count" aria-live="polite">— produtos</span>
    </header>

    <div class="layout">
      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="panel-heading">
          <h2 id="form-title">Novo produto</h2>
          <p id="form-description">Preencha os dados abaixo.</p>
        </div>
        <form id="product-form">
          <label for="name">Nome <span aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" maxlength="120" autocomplete="off" required>

          <label for="description">Descrição</label>
          <textarea id="description" name="description" rows="3" maxlength="1000"></textarea>

          <div class="field-row">
            <div>
              <label for="price">Preço (R$) <span aria-hidden="true">*</span></label>
              <input id="price" name="price" type="number" min="0" step="0.01" inputmode="decimal" required>
            </div>
            <div>
              <label for="stockQuantity">Estoque <span aria-hidden="true">*</span></label>
              <input id="stockQuantity" name="stockQuantity" type="number" min="0" step="1" inputmode="numeric" required>
            </div>
          </div>

          <div class="form-actions">
            <button class="button primary" id="submit-button" type="submit">Cadastrar produto</button>
            <button class="button secondary" id="cancel-button" type="button" hidden>Cancelar edição</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="panel-heading list-heading">
          <div>
            <h2 id="list-title">Lista de produtos</h2>
            <p>Edite ou exclua um produto quando precisar.</p>
          </div>
          <button class="button secondary refresh-button" id="refresh-button" type="button">Atualizar</button>
        </div>
        <p class="notice" id="status" role="status" aria-live="polite"></p>
        <div id="product-list" class="product-list"></div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
